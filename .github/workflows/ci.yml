name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knee-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: knee-web/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check backend

      - name: Mypy
        run: python -m mypy backend

      - name: Backend API tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knee-web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: knee-web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: Compile and verify Vercel rewrite configuration
        shell: bash
        run: |
          npx @vercel/config compile > "$RUNNER_TEMP/vercel-config.json"
          node -e 'const fs=require("node:fs"); const config=JSON.parse(fs.readFileSync(process.argv[1], "utf8")).config; const route=config.rewrites?.[0]; if (!route || route.dest !== "$KNEE_API_ORIGIN/api/$1" || !JSON.stringify(route).includes("KNEE_STAGING_GATE_TOKEN")) process.exit(1);' "$RUNNER_TEMP/vercel-config.json"

      - name: Build frontend
        run: npm run build

  deploy-cloud-run:
    name: Deploy Cloud Run (${{ github.ref_name }})
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: cloud-run-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      DICOM_BUCKET: ${{ vars.DICOM_BUCKET }}
      FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
      STAGING_GATE_SECRET_NAME: ${{ vars.STAGING_GATE_SECRET_NAME }}
      IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/knee-review-api:${{ github.sha }}
      CANDIDATE_TAG: ci-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment configuration
        shell: bash
        run: |
          required=(GCP_PROJECT_ID GCP_REGION AR_REPOSITORY CLOUD_RUN_SERVICE CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT DICOM_BUCKET FIRESTORE_DATABASE CORS_ALLOWED_ORIGINS WIF_PROVIDER WIF_SERVICE_ACCOUNT)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Environment variable: $name" >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_REF_NAME" == "dev" && -z "$STAGING_GATE_SECRET_NAME" ]]; then
            echo "Staging requires GitHub Environment variable STAGING_GATE_SECRET_NAME." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push immutable image
        shell: bash
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE_URI" ./knee-web
          docker push "$IMAGE_URI"

      - name: Deploy candidate revision
        id: deploy
        shell: bash
        run: |
          secret_args=()
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            secret_args+=(--update-secrets "STAGING_GATE_TOKEN=${STAGING_GATE_SECRET_NAME}:latest")
          fi

          deploy_args=(
            --image "$IMAGE_URI" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT" \
            --memory 4Gi \
            --cpu 2 \
            --concurrency 1 \
            --max 1 \
            --timeout 3600s \
            "${secret_args[@]}" \
            "--update-env-vars=^@^METADATA_BACKEND=firestore@GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}@FIRESTORE_DATABASE=${FIRESTORE_DATABASE}@DICOM_BUCKET=${DICOM_BUCKET}@CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}@SESSION_COOKIE_SECURE=true@MAX_UPLOAD_MIB=600@MAX_EXPANDED_MIB=800@MAX_SESSION_MIB=800@MAX_DICOM_FILE_MIB=200@MAX_DICOM_FILES=500"
          )

          describe_error="$RUNNER_TEMP/cloud-run-service-describe.err"
          if gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null 2>"$describe_error"; then
            service_exists=true
          elif grep -Eqi "NOT_FOUND|Cannot find service" "$describe_error"; then
            service_exists=false
          else
            cat "$describe_error" >&2
            exit 1
          fi

          if [[ "$service_exists" == true ]]; then
            echo "Existing Cloud Run service: deploy without traffic, then smoke-test and promote."
            gcloud run deploy "$CLOUD_RUN_SERVICE" "${deploy_args[@]}" \
              --no-traffic --tag "$CANDIDATE_TAG"
          else
            echo "First deployment: create the service, then smoke-test its initial revision."
            gcloud run deploy "$CLOUD_RUN_SERVICE" "${deploy_args[@]}"
          fi
          echo "service_exists=$service_exists" >> "$GITHUB_OUTPUT"

      - name: Smoke-test candidate revision
        id: smoke
        shell: bash
        run: |
          candidate_url=""
          for attempt in {1..12}; do
            service_json="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
            if [[ "${{ steps.deploy.outputs.service_exists }}" == true ]]; then
              candidate_url="$(jq -r --arg tag "$CANDIDATE_TAG" \
                '.status.traffic[]? | select(.tag == $tag) | .url' <<<"$service_json" | head -n 1)"
            else
              candidate_url="$(jq -r '.status.url // empty' <<<"$service_json")"
            fi
            [[ -n "$candidate_url" && "$candidate_url" != "null" ]] && break
            sleep 5
          done
          if [[ -z "$candidate_url" || "$candidate_url" == "null" ]]; then
            echo "Cloud Run did not return a URL for the candidate revision." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 3 \
            "$candidate_url/api/health" | jq -e '.status == "ok" and .service == "knee-review"'

      - name: Promote tested revision to 100 percent traffic
        if: steps.deploy.outputs.service_exists == 'true'
        shell: bash
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-latest
