services:
  knee-web:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATA_DIR: /app/data
      EXAMPLES_DIR: /examples
      SESSION_IDLE_TTL_MINUTES: ${SESSION_IDLE_TTL_MINUTES:-60}
      SESSION_MAX_TTL_HOURS: ${SESSION_MAX_TTL_HOURS:-4}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MAX_UPLOAD_MIB: ${MAX_UPLOAD_MIB:-600}
      MAX_EXPANDED_MIB: ${MAX_EXPANDED_MIB:-800}
      MAX_SESSION_MIB: ${MAX_SESSION_MIB:-800}
      MAX_DICOM_FILE_MIB: ${MAX_DICOM_FILE_MIB:-200}
      MAX_DICOM_FILES: ${MAX_DICOM_FILES:-500}
    volumes:
      - knee_data:/app/data
      - ../dicom-viewer/files:/examples:ro

volumes:
  knee_data:
